# CI — quality gate for every pull request.
# Job name `ci` is the required check defined in O-02 (branch protection: DEFINED – NOT ENFORCED until GitHub Pro).
# No secrets are used here. Third-party actions are pinned by commit SHA (tag in comment).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Throwaway database for integration tests only. Trust auth, no password, no real data.
      postgres:
        image: postgres:16-bookworm@sha256:cd0e9518bda5f2ea667ff84d22795d089720c883f288e215d97ce57437e8ef37 # resolved 25/11/2026
        env:
          POSTGRES_DB: aidevteam_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Repo hygiene (no committed env/key files)
        run: |
          set -euo pipefail
          # Only file NAMES are checked; contents are never read.
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|id_rsa|id_ed25519' | grep -vE '\.env\.example$|\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Forbidden secret-like files are tracked:"; echo "$bad"; exit 1
          fi

      - name: Deploy script tests
        run: bash tests/deploy/test_deploy.sh

      - name: Detect Node workspace
        id: detect
        run: |
          if [ -f package.json ] && [ -f pnpm-lock.yaml ] && [ -f .nvmrc ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json/pnpm-lock.yaml/.nvmrc yet (before P1-01). Lint/typecheck/test skipped."
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.node == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (reads packageManager from package.json)

      - name: Setup Node
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.node == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.detect.outputs.node == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.detect.outputs.node == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.detect.outputs.node == 'true'
        run: pnpm test

      - name: Script tests (progress report)
        if: steps.detect.outputs.node == 'true'
        run: pnpm test:scripts

      - name: Integration tests (PostgreSQL)
        if: steps.detect.outputs.node == 'true'
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/aidevteam_test
        run: pnpm test:integration

      - name: Backup/restore test (PostgreSQL)
        if: steps.detect.outputs.node == 'true'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
        run: |
          set -euo pipefail
          # Client tools must match the server MAJOR version (16): a newer pg_dump writes settings PostgreSQL 16
          # rejects on restore, and the runner image does not ship a 16 client. Run the clients from the SAME
          # pinned image as the service container via small wrappers placed first on PATH.
          img="postgres:16-bookworm@sha256:cd0e9518bda5f2ea667ff84d22795d089720c883f288e215d97ce57437e8ef37"
          docker pull -q "$img"
          bindir="$RUNNER_TEMP/pg16bin"; mkdir -p "$bindir"
          for tool in pg_dump pg_restore psql; do
            printf '%s\n' '#!/usr/bin/env bash' \
              "exec docker run --rm -i --network host -u \"\$(id -u):\$(id -g)\" -v /tmp:/tmp -v \"\$RUNNER_TEMP:\$RUNNER_TEMP\" -v \"\$PWD:\$PWD\" -w \"\$PWD\" -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE $img $tool \"\$@\"" \
              > "$bindir/$tool"
            chmod +x "$bindir/$tool"
          done
          export PATH="$bindir:$PATH" TMPDIR=/tmp
          pg_dump --version
          bash tests/backup/test_backup_restore.sh

  # Browser E2E (QA-01, D-2026-11-26-08): builds api + web, runs every tests/e2e/*.e2e.cjs against a throwaway
  # *_test database with fake data. OAuth values inside run-local.sh are fake; no secrets are used.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-bookworm@sha256:cd0e9518bda5f2ea667ff84d22795d089720c883f288e215d97ce57437e8ef37 # resolved 25/11/2026
        env:
          POSTGRES_DB: aidevteam_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (reads packageManager from package.json)

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright + Chromium
        # Not a repo dependency yet (tests/e2e/README.md): exact version installed globally, resolved via NODE_PATH.
        run: |
          set -euo pipefail
          npm install -g playwright@1.63.0
          playwright --version
          playwright install --with-deps chromium

      - name: Browser E2E
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
        run: |
          set -euo pipefail
          export NODE_PATH="$(npm root -g)"
          bash tests/e2e/run-local.sh

      - name: Upload api/web logs (failure only)
        # Server logs only — no Playwright traces or screenshots (they could hold session cookies).
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-server-logs
          path: |
            /tmp/e2e-api.log
            /tmp/e2e-web.log
          retention-days: 7
          if-no-files-found: ignore

# CI — quality gate for every pull request.
# Job name `ci` is the required check defined in O-02 (branch protection: DEFINED – NOT ENFORCED until GitHub Pro).
# No secrets are used here. Third-party actions are pinned by commit SHA (tag in comment).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Throwaway database for integration tests only. Trust auth, no password, no real data.
      postgres:
        image: postgres:16-bookworm@sha256:cd0e9518bda5f2ea667ff84d22795d089720c883f288e215d97ce57437e8ef37 # resolved 25/11/2026
        env:
          POSTGRES_DB: aidevteam_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Repo hygiene (no committed env/key files)
        run: |
          set -euo pipefail
          # Only file NAMES are checked; contents are never read.
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.key$|id_rsa|id_ed25519' | grep -vE '\.env\.example$|\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Forbidden secret-like files are tracked:"; echo "$bad"; exit 1
          fi

      - name: Deploy script tests
        run: bash tests/deploy/test_deploy.sh

      - name: Detect Node workspace
        id: detect
        run: |
          if [ -f package.json ] && [ -f pnpm-lock.yaml ] && [ -f .nvmrc ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json/pnpm-lock.yaml/.nvmrc yet (before P1-01). Lint/typecheck/test skipped."
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.node == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (reads packageManager from package.json)

      - name: Setup Node
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.node == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.detect.outputs.node == 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.detect.outputs.node == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.detect.outputs.node == 'true'
        run: pnpm test

      - name: Integration tests (PostgreSQL)
        if: steps.detect.outputs.node == 'true'
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/aidevteam_test
        run: pnpm test:integration

      - name: Backup/restore test (PostgreSQL)
        if: steps.detect.outputs.node == 'true'
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
        run: |
          set -euo pipefail
          # Client tools must match the server MAJOR version (16). The runner's default pg_dump is newer and
          # writes settings PostgreSQL 16 rejects on restore — install and use the 16 client explicitly.
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          export PG_DUMP=/usr/lib/postgresql/16/bin/pg_dump PG_RESTORE=/usr/lib/postgresql/16/bin/pg_restore PSQL=/usr/lib/postgresql/16/bin/psql
          "$PG_DUMP" --version
          PATH=/usr/lib/postgresql/16/bin:$PATH bash tests/backup/test_backup_restore.sh
